name: OCC Wien Scraper

on:
  # Manuell startbar über GitHub UI
  workflow_dispatch:

  # Per HTTP getriggert vom Frontend (POST an /repos/.../dispatches)
  repository_dispatch:
    types: [run-occ-vie]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread google-auth beautifulsoup4

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Write Google Credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run Scraper
        env:
          PANDA_USER: ${{ secrets.PANDA_USER }}
          PANDA_PASS: ${{ secrets.PANDA_PASS }}
        run: python scraper.py

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
