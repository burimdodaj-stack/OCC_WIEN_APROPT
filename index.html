<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCC Wien + Zürich Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-2: #111827;
    --panel: #151b2e;
    --line: #2a3349;
    --ink: #e8ecf5;
    --muted: #8a93ad;
    --accent: #f4c542;
    --accent-2: #ff6b35;
    --green: #4ade80;
    --red: #ef4444;
    --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(244, 197, 66, 0.08), transparent 60%),
      radial-gradient(800px 500px at -10% 100%, rgba(255, 107, 53, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "JetBrains Mono", monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 1000px; }
  header { margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }
  h1 {
    font-family: "Fraunces", serif; font-weight: 800;
    font-size: clamp(34px, 6vw, 56px); line-height: 1.05;
    margin: 0; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
  }
  .panda-logo {
    width: clamp(48px, 8vw, 72px);
    height: clamp(48px, 8vw, 72px);
    flex-shrink: 0;
  }
  .panda-logo .circle { fill: none; stroke: var(--ink); stroke-width: 4; }
  .panda-logo .ear { fill: var(--ink); }
  .panda-logo .eye, .panda-logo .nose { fill: var(--ink); }
  .panda-logo .mouth {
    fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 32px; margin-bottom: 24px;
  }
  .card-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
    flex-wrap: wrap; gap: 12px;
  }
  .card h2 {
    font-family: "Fraunces", serif; font-size: 20px;
    margin: 0; font-weight: 600;
  }

  /* Zwei Knöpfe nebeneinander */
  .scraper-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 640px) {
    .scraper-row { grid-template-columns: 1fr; }
  }

  .trigger-btn {
    width: 100%; background: var(--accent); color: var(--bg);
    border: none; padding: 22px 20px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.2s ease; border-radius: 2px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .trigger-btn.zh {
    background: var(--bg-2); color: var(--ink);
    border: 1px solid var(--accent);
  }
  .trigger-btn:hover:not(:disabled) {
    background: var(--accent-2); color: var(--ink);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(244, 197, 66, 0.25);
    border-color: var(--accent-2);
  }
  .trigger-btn.zh:hover:not(:disabled) {
    background: var(--accent); color: var(--bg);
  }
  .trigger-btn:disabled {
    background: var(--line); color: var(--muted); cursor: not-allowed;
    border-color: var(--line); transform: none; box-shadow: none;
  }
  .trigger-btn .arrow { font-size: 20px; transition: transform 0.2s ease; }
  .trigger-btn:hover:not(:disabled) .arrow { transform: translateX(6px); }

  .progress-wrap {
    display: none; margin-top: 16px;
    padding: 16px; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 2px;
  }
  .progress-wrap.active { display: block; }
  .progress-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 10px;
  }
  .progress-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--muted);
  }
  .progress-percent {
    font-family: "Fraunces", serif; font-size: 22px;
    font-weight: 800; color: var(--accent);
  }
  .progress-track {
    width: 100%; height: 6px; background: var(--bg);
    border-radius: 999px; overflow: hidden; border: 1px solid var(--line);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px; transition: width 0.6s ease;
  }
  .progress-status {
    margin-top: 10px; font-size: 12px;
    color: var(--ink); min-height: 18px;
  }
  .progress-status.error { color: var(--red); }
  .progress-status.success { color: var(--green); }

  .refresh-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 8px 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s ease;
    border-radius: 2px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .refresh-btn:hover {
    border-color: var(--accent); color: var(--accent);
  }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .refresh-btn .spin { display: inline-block; }
  .refresh-btn.loading .spin { animation: spin 1s linear infinite; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .last-updated {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 4px;
  }

  /* Tab-Gruppen für Wien + Zürich */
  .tab-group {
    margin-bottom: 12px;
  }
  .tab-group-label {
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-group-label::after {
    content: ""; flex: 1; height: 1px;
    background: var(--line);
  }
  .tab-group-label.wien { color: var(--accent); }
  .tab-group-label.zh   { color: var(--blue); }

  .panda-tabs {
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }
  .panda-tab {
    flex: 1; min-width: 70px;
    background: var(--bg-2); color: var(--muted);
    border: 1px solid var(--line);
    padding: 11px 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s ease;
    border-radius: 2px;
  }
  .panda-tab:hover {
    border-color: var(--accent); color: var(--ink);
  }
  .panda-tab.active {
    background: var(--accent); color: var(--bg);
    border-color: var(--accent);
  }
  .panda-tab[data-city="zh"]:hover {
    border-color: var(--blue); color: var(--ink);
  }
  .panda-tab[data-city="zh"].active {
    background: var(--blue); color: var(--bg);
    border-color: var(--blue);
  }

  .chart-container {
    position: relative;
    width: 100%;
    height: 420px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    margin-top: 16px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .stat-box {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 2px; padding: 14px; text-align: center;
  }
  .stat-label {
    font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: "Fraunces", serif;
    font-size: 22px; font-weight: 800;
    color: var(--accent);
  }
  .stat-value.zh { color: var(--blue); }

  .chart-message {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; width: 90%;
  }
  .chart-loading { color: var(--muted); font-size: 13px; }
  .chart-error   { color: var(--red);   font-size: 13px; }
  .chart-error small {
    display: block; margin-top: 8px;
    color: var(--muted); font-size: 11px;
  }
  .retry-btn {
    margin-top: 14px;
    background: var(--accent); color: var(--bg);
    border: none; padding: 10px 20px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; border-radius: 2px;
  }
  .retry-btn:hover { background: var(--accent-2); color: var(--ink); }

  .sheet-frame {
    width: 100%; height: 640px;
    border: 1px solid var(--line); border-radius: 4px;
    background: #ffffff;
  }
  .open-link {
    display: inline-block; margin-top: 14px;
    color: var(--accent); text-decoration: none;
    font-size: 13px;
    border-bottom: 1px dashed var(--accent); padding-bottom: 2px;
  }
  .open-link:hover { color: var(--accent-2); border-color: var(--accent-2); }
  footer {
    margin-top: 40px; text-align: center;
    color: var(--muted); font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  @media (max-width: 640px) {
    body { padding: 20px 12px; }
    .card { padding: 20px; }
    .panda-tabs { gap: 6px; }
    .panda-tab {
      padding: 10px 6px; font-size: 10px; min-width: 50px;
      letter-spacing: 0.05em;
    }
    .chart-container { height: 320px; padding: 10px; }
    .stats-row { grid-template-columns: 1fr; gap: 8px; }
    .stat-value { font-size: 20px; }
    .sheet-frame { height: 480px; }
    .trigger-btn { padding: 18px 16px; font-size: 13px; }
    .card-head { flex-direction: column; align-items: flex-start; }
    .refresh-btn { align-self: stretch; justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="eyebrow">PandaParken · Occupancy Dashboard</div>
    <h1>
      <span>OCC</span>
      <svg class="panda-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Panda Parken Logo">
        <circle class="ear" cx="22" cy="22" r="11" />
        <circle class="ear" cx="78" cy="22" r="11" />
        <circle class="circle" cx="50" cy="55" r="36" />
        <ellipse class="eye" cx="36" cy="50" rx="7" ry="9" transform="rotate(-15 36 50)" />
        <ellipse class="eye" cx="64" cy="50" rx="7" ry="9" transform="rotate(15 64 50)" />
        <circle cx="37" cy="49" r="2.2" fill="#0a0e1a" />
        <circle cx="63" cy="49" r="2.2" fill="#0a0e1a" />
        <ellipse class="nose" cx="50" cy="65" rx="4" ry="3" />
        <path class="mouth" d="M 46 71 Q 50 76 54 71" />
      </svg>
    </h1>
  </header>

  <!-- ─── 2 Knöpfe: Wien + Zürich ─────────────────────────────────────── -->
  <div class="card">
    <h2>Scraper starten</h2>

    <div class="scraper-row">
      <button class="trigger-btn" data-city="wien">
        <span>Hole mir OCC Wien</span>
        <span class="arrow">→</span>
      </button>
      <button class="trigger-btn zh" data-city="zh">
        <span>Hole mir OCC Zürich</span>
        <span class="arrow">→</span>
      </button>
    </div>

    <!-- Progress für Wien -->
    <div id="progressWrap_wien" class="progress-wrap">
      <div class="progress-head">
        <span class="progress-label">Wien</span>
        <span class="progress-percent" id="progressPercent_wien">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill_wien"></div>
      </div>
      <div class="progress-status" id="progressStatus_wien">Warte auf Start ...</div>
    </div>

    <!-- Progress für Zürich -->
    <div id="progressWrap_zh" class="progress-wrap">
      <div class="progress-head">
        <span class="progress-label">Zürich</span>
        <span class="progress-percent" id="progressPercent_zh">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill_zh"></div>
      </div>
      <div class="progress-status" id="progressStatus_zh">Warte auf Start ...</div>
    </div>
  </div>

  <!-- ─── Graph Wien + Zürich ────────────────────────────────────────── -->
  <div class="card">
    <div class="card-head">
      <div>
        <h2>Auslastung vs. Ziel</h2>
        <div class="last-updated" id="lastUpdated">Lade ...</div>
      </div>
      <button id="refreshBtn" class="refresh-btn">
        <span class="spin">↻</span>
        <span>Aktualisieren</span>
      </button>
    </div>

    <!-- Wien Tabs -->
    <div class="tab-group">
      <div class="tab-group-label wien">Wien</div>
      <div class="panda-tabs">
        <button class="panda-tab active" data-city="wien" data-panda="all">All</button>
        <button class="panda-tab" data-city="wien" data-panda="1">P1</button>
        <button class="panda-tab" data-city="wien" data-panda="2">P2</button>
        <button class="panda-tab" data-city="wien" data-panda="3">P3</button>
      </div>
    </div>

    <!-- Zürich Tabs -->
    <div class="tab-group">
      <div class="tab-group-label zh">Zürich</div>
      <div class="panda-tabs">
        <button class="panda-tab" data-city="zh" data-panda="all">All</button>
        <button class="panda-tab" data-city="zh" data-panda="1">P1</button>
        <button class="panda-tab" data-city="zh" data-panda="2">P2</button>
        <button class="panda-tab" data-city="zh" data-panda="4">P4</button>
        <button class="panda-tab" data-city="zh" data-panda="5">P5</button>
        <button class="panda-tab" data-city="zh" data-panda="6">P6</button>
      </div>
    </div>

    <div class="chart-container">
      <div id="chartMessage" class="chart-message chart-loading">Lade Daten aus dem Sheet ...</div>
      <canvas id="occChart" style="display:none;"></canvas>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-box">
        <div class="stat-label">Auslastung</div>
        <div class="stat-value" id="statAvgOcc">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Ziel</div>
        <div class="stat-value" id="statAvgTarget">—</div>
      </div>
    </div>
  </div>

  <!-- ─── Sheet ───────────────────────────────────────────────────────── -->
  <div class="card">
    <h2>Live-Ergebnis</h2>
    <iframe
      class="sheet-frame"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTNx5KCMaGnTYMYQtSlUTCWYL8GspBS6R71EeVl1wfXL4hIsGpSf16z5EhyVzzf-j74G8db9Mr7VIG2/pubhtml?gid=1418262514&single=true&widget=true&headers=false"
      title="OCC Sheet">
    </iframe>
    <a class="open-link" href="https://docs.google.com/spreadsheets/d/1Xq1GG4f_2pjZn2-H0qZsGwMCbdgdDyQrPyrBcTeSmv0/edit#gid=1418262514" target="_blank">
      → In Google Sheets öffnen
    </a>
  </div>

  <footer>Built with ☕ &nbsp;·&nbsp; GitHub Actions + Playwright</footer>
</div>

<script>
  // ═══════════════════════════════════════════════════════════════════════
  // Konfiguration
  // ═══════════════════════════════════════════════════════════════════════
  const WORKER_URL = "https://occ-wien-proxy.burim-dodaj.workers.dev";

  const SHEET_ID   = "1Xq1GG4f_2pjZn2-H0qZsGwMCbdgdDyQrPyrBcTeSmv0";
  const SHEET_GID  = "1418262514";

  const CSV_SOURCES = [
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`,
    `https://docs.google.com/spreadsheets/d/e/2PACX-1vTNx5KCMaGnTYMYQtSlUTCWYL8GspBS6R71EeVl1wfXL4hIsGpSf16z5EhyVzzf-j74G8db9Mr7VIG2/pub?gid=${SHEET_GID}&single=true&output=csv`,
  ];

  const FETCH_TIMEOUT_MS = 15000;
  const MAX_RETRIES      = 3;
  const RETRY_DELAY_MS   = 2000;
  const AUTO_REFRESH_MS  = 5 * 60 * 1000;

  // ═══════════════════════════════════════════════════════════════════════
  // SPALTEN-MAPPING
  // ═══════════════════════════════════════════════════════════════════════
  // Wien:  A=0 Datum | B/C=1,2 P1 | D/E=3,4 P2 | F/G=5,6 P3 | H/I=7,8 All Wien
  // Zürich: J/K=9,10 P1 | L/M=11,12 P2 | N/O=13,14 P4 | P/Q=15,16 P5 |
  //         R/S=17,18 P6 | T/U=19,20 All Zürich
  const PANDA_CONFIG = {
    // Wien
    "wien-all": { name: "Wien · All", city: "wien", occCol: 7,  targetCol: 8  },
    "wien-1":   { name: "Wien · P1",  city: "wien", occCol: 1,  targetCol: 2  },
    "wien-2":   { name: "Wien · P2",  city: "wien", occCol: 3,  targetCol: 4  },
    "wien-3":   { name: "Wien · P3",  city: "wien", occCol: 5,  targetCol: 6  },
    // Zürich
    "zh-all":   { name: "Zürich · All", city: "zh", occCol: 19, targetCol: 20 },
    "zh-1":     { name: "Zürich · P1",  city: "zh", occCol: 9,  targetCol: 10 },
    "zh-2":     { name: "Zürich · P2",  city: "zh", occCol: 11, targetCol: 12 },
    "zh-4":     { name: "Zürich · P4",  city: "zh", occCol: 13, targetCol: 14 },
    "zh-5":     { name: "Zürich · P5",  city: "zh", occCol: 15, targetCol: 16 },
    "zh-6":     { name: "Zürich · P6",  city: "zh", occCol: 17, targetCol: 18 },
  };

  // ═══════════════════════════════════════════════════════════════════════
  // SCRAPER TRIGGER — generisch für jede City
  // ═══════════════════════════════════════════════════════════════════════
  const cityState = {
    wien: { pollInterval: null, fakeInterval: null, fakeProgress: 0 },
    zh:   { pollInterval: null, fakeInterval: null, fakeProgress: 0 },
  };

  function $(id) { return document.getElementById(id); }

  function setProgress(city, percent, statusText, statusClass = "") {
    const p = Math.max(0, Math.min(100, percent));
    $(`progressFill_${city}`).style.width = p + "%";
    $(`progressPercent_${city}`).textContent = Math.round(p) + "%";
    const statusEl = $(`progressStatus_${city}`);
    statusEl.textContent = statusText;
    statusEl.className = "progress-status " + statusClass;
  }

  function resetCity(city) {
    const btn = document.querySelector(`.trigger-btn[data-city="${city}"]`);
    btn.disabled = false;
    btn.querySelector("span").textContent = city === "wien" ? "Hole mir OCC Wien" : "Hole mir OCC Zürich";
    clearInterval(cityState[city].pollInterval);
    clearInterval(cityState[city].fakeInterval);
    cityState[city].fakeProgress = 0;
  }

  async function triggerWorkflow(city) {
    const btn = document.querySelector(`.trigger-btn[data-city="${city}"]`);
    btn.disabled = true;
    btn.querySelector("span").textContent = "Läuft ...";
    $(`progressWrap_${city}`).classList.add("active");
    setProgress(city, 2, "Sende Trigger an den Worker ...");

    try {
      const res = await fetch(`${WORKER_URL}/trigger/${city}`, { method: "POST" });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Trigger fehlgeschlagen");

      setProgress(city, 8, "Workflow getriggert, warte auf Start ...");
      await new Promise(r => setTimeout(r, 4000));

      const latestRes  = await fetch(`${WORKER_URL}/latest-run/${city}`);
      const latestData = await latestRes.json();

      if (latestData.ok && latestData.run) {
        const runId = latestData.run.id;
        setProgress(city, 12, `Run #${runId} läuft ...`);
        startFakeProgress(city);
        cityState[city].pollInterval = setInterval(() => pollRunStatus(city, runId), 5000);
      } else {
        setProgress(city, 10, "Run gestartet — Status nicht abrufbar. Sheet wird in ~2 Min aktualisiert.");
        startFakeProgress(city);
      }
    } catch (err) {
      console.error(err);
      setProgress(city, 0, "Fehler: " + err.message, "error");
      resetCity(city);
    }
  }

  function startFakeProgress(city) {
    cityState[city].fakeInterval = setInterval(() => {
      if (cityState[city].fakeProgress < 88) {
        cityState[city].fakeProgress += 1.5;
        const realPct = 12 + cityState[city].fakeProgress * 0.85;
        $(`progressFill_${city}`).style.width = realPct + "%";
        $(`progressPercent_${city}`).textContent = Math.round(realPct) + "%";
      }
    }, 2000);
  }

  async function pollRunStatus(city, runId) {
    try {
      const res = await fetch(`${WORKER_URL}/run-status?id=${runId}`);
      const data = await res.json();

      if (data.status === "completed") {
        clearInterval(cityState[city].pollInterval);
        clearInterval(cityState[city].fakeInterval);

        if (data.conclusion === "success") {
          setProgress(city, 100, "✓ Scraping fertig — Daten sind im Sheet!", "success");
          // Iframe + Chart neu laden (egal welche City — beide sind im selben Sheet)
          const iframe = document.querySelector(".sheet-frame");
          iframe.src = iframe.src;
          setTimeout(() => loadChartData(true), 3000);
        } else {
          setProgress(city, 100, `✗ Workflow fehlgeschlagen: ${data.conclusion}`, "error");
        }
        setTimeout(() => resetCity(city), 4000);
      } else if (data.status === "in_progress") {
        $(`progressStatus_${city}`).textContent = "Scraper läuft ...";
      } else if (data.status === "queued") {
        $(`progressStatus_${city}`).textContent = "Warte in der Queue ...";
      }
    } catch (e) {
      console.error("pollRunStatus error", e);
    }
  }

  // Beide Knöpfe verkabeln
  document.querySelectorAll(".trigger-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      triggerWorkflow(btn.dataset.city);
    });
  });

  // ═══════════════════════════════════════════════════════════════════════
  // GRAPH — Wien + Zürich
  // ═══════════════════════════════════════════════════════════════════════
  let chartInstance = null;
  let sheetData = null;
  let currentKey = "wien-all";
  let autoRefreshTimer = null;

  function fetchWithTimeout(url, timeoutMs) {
    return Promise.race([
      fetch(url, { cache: "no-store" }).then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      }),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Timeout nach " + timeoutMs + "ms")), timeoutMs)
      )
    ]);
  }

  async function tryFetchCSV(baseUrl, maxRetries) {
    let lastErr = null;
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
        const text = await fetchWithTimeout(url, FETCH_TIMEOUT_MS);
        if (text.length < 10) throw new Error("Leere Antwort");
        return text;
      } catch (err) {
        lastErr = err;
        console.warn(`Versuch ${attempt}/${maxRetries} fehlgeschlagen:`, err.message);
        if (attempt < maxRetries) await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
      }
    }
    throw lastErr;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  function parseValue(s) {
    if (s == null) return null;
    let t = String(s).trim();
    if (t === "" || t === "-" || t === "#N/A") return null;
    t = t.replace(/%/g, "").replace(/,/g, ".").trim();
    const n = parseFloat(t);
    return isNaN(n) ? null : n;
  }

  function displayCell(s) {
    if (s == null) return "—";
    const t = String(s).trim();
    if (t === "" || t === "-" || t === "#N/A") return "—";
    if (t.includes("%")) return t;
    const n = parseValue(t);
    if (n == null) return t;
    return n.toFixed(2) + "%";
  }

  function formatDate(s) {
    if (!s) return "";
    const t = String(s).trim();
    let m = t.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?$/);
    if (m) {
      const dd = m[1].padStart(2, "0");
      const mm = m[2].padStart(2, "0");
      return `${dd}.${mm}`;
    }
    m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) {
      const mm = m[2].padStart(2, "0");
      const dd = m[3].padStart(2, "0");
      return `${dd}.${mm}`;
    }
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m) {
      const dd = m[1].padStart(2, "0");
      const mm = m[2].padStart(2, "0");
      return `${dd}.${mm}`;
    }
    const d = new Date(t);
    if (!isNaN(d.getTime())) {
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return `${dd}.${mm}`;
    }
    return t;
  }

  function setLastUpdated() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    $("lastUpdated").textContent = `Aktualisiert: ${hh}:${mm} Uhr`;
  }

  function showChartMessage(html, cls) {
    const messageEl = $("chartMessage");
    const canvasEl  = $("occChart");
    messageEl.innerHTML = html;
    messageEl.className = "chart-message " + cls;
    messageEl.style.display = "block";
    canvasEl.style.display = "none";
  }

  async function loadChartData(silent = false) {
    const refreshBtn = $("refreshBtn");
    refreshBtn.classList.add("loading");
    refreshBtn.disabled = true;

    if (!silent) {
      showChartMessage("Lade Daten aus dem Sheet ...", "chart-loading");
    }

    let lastErr = null;
    for (let i = 0; i < CSV_SOURCES.length; i++) {
      try {
        const text = await tryFetchCSV(CSV_SOURCES[i], MAX_RETRIES);
        sheetData = parseCSV(text);
        if (sheetData.length < 3) throw new Error("Sheet hat zu wenig Daten");

        renderChart(currentKey);
        setLastUpdated();
        refreshBtn.classList.remove("loading");
        refreshBtn.disabled = false;
        return;
      } catch (err) {
        console.error(`CSV-Quelle ${i + 1} fehlgeschlagen:`, err);
        lastErr = err;
      }
    }

    refreshBtn.classList.remove("loading");
    refreshBtn.disabled = false;
    showChartMessage(
      `Fehler beim Laden: ${lastErr ? lastErr.message : "Unbekannter Fehler"}
       <small>Pr&uuml;fe Internet oder Sheet-Freigabe.</small>
       <button class="retry-btn" onclick="loadChartData()">Erneut versuchen</button>`,
      "chart-error"
    );
  }

  function renderChart(key) {
    const cfg = PANDA_CONFIG[key];
    if (!cfg || !sheetData) return;

    const isZH      = cfg.city === "zh";
    const occColor  = isZH ? "#60a5fa" : "#f4c542";
    const occBgFrom = isZH ? "rgba(96, 165, 250, 0.35)" : "rgba(244, 197, 66, 0.35)";
    const occBgTo   = isZH ? "rgba(96, 165, 250, 0)"    : "rgba(244, 197, 66, 0)";
    const tgtColor  = isZH ? "#f4c542" : "#60a5fa";

    const summaryRow = sheetData[0] || [];
    const statOcc    = $("statAvgOcc");
    const statTarget = $("statAvgTarget");
    statOcc.textContent    = displayCell(summaryRow[cfg.occCol]);
    statTarget.textContent = displayCell(summaryRow[cfg.targetCol]);
    statOcc.className    = "stat-value" + (isZH ? " zh" : "");
    statTarget.className = "stat-value" + (isZH ? "" : ""); // Ziel bleibt gelb-akzent — wir lassen es einheitlich

    const labels = [];
    const occData = [];
    const targetData = [];

    for (let i = 2; i < Math.min(sheetData.length, 64); i++) {
      const row = sheetData[i] || [];
      const dateCell = row[0];
      const occVal = parseValue(row[cfg.occCol]);
      const tgtVal = parseValue(row[cfg.targetCol]);
      if (!dateCell || (occVal == null && tgtVal == null)) continue;
      labels.push(formatDate(dateCell));
      occData.push(occVal);
      targetData.push(tgtVal);
    }

    $("chartMessage").style.display = "none";
    const canvasEl = $("occChart");
    canvasEl.style.display = "block";

    if (chartInstance) chartInstance.destroy();

    const ctx = canvasEl.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, occBgFrom);
    gradient.addColorStop(1, occBgTo);

    chartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: cfg.name + " — Auslastung %",
            data: occData,
            borderColor: occColor,
            backgroundColor: gradient,
            borderWidth: 2.5,
            fill: true, tension: 0.35,
            pointRadius: 0, pointHoverRadius: 6,
            pointHoverBackgroundColor: occColor,
            pointHoverBorderColor: "#0a0e1a",
            pointHoverBorderWidth: 2,
          },
          {
            label: "Ziel %",
            data: targetData,
            borderColor: tgtColor,
            backgroundColor: "transparent",
            borderWidth: 2, borderDash: [6, 4],
            fill: false, tension: 0.35,
            pointRadius: 0, pointHoverRadius: 5,
            pointHoverBackgroundColor: tgtColor,
            pointHoverBorderColor: "#0a0e1a",
            pointHoverBorderWidth: 2,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            position: "top",
            labels: {
              color: "#e8ecf5",
              font: { family: "JetBrains Mono", size: 12 },
              usePointStyle: true, pointStyle: "line",
              boxWidth: 30, padding: 16,
            }
          },
          tooltip: {
            backgroundColor: "#111827",
            borderColor: "#2a3349", borderWidth: 1,
            titleColor: occColor, bodyColor: "#e8ecf5",
            titleFont: { family: "JetBrains Mono", size: 13, weight: "700" },
            bodyFont:  { family: "JetBrains Mono", size: 12 },
            padding: 12,
            callbacks: {
              label: function(ctx) {
                const v = ctx.parsed.y;
                if (v == null) return ctx.dataset.label + ": —";
                return ctx.dataset.label + ": " + v.toFixed(1) + "%";
              }
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: "#8a93ad",
              font: { family: "JetBrains Mono", size: 10 },
              maxRotation: 60, minRotation: 0,
              autoSkip: true, maxTicksLimit: 12,
            },
            grid: { color: "rgba(42, 51, 73, 0.4)" }
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: "#8a93ad",
              font: { family: "JetBrains Mono", size: 11 },
              callback: function(value) { return value + "%"; }
            },
            grid: { color: "rgba(42, 51, 73, 0.4)" }
          }
        }
      }
    });
  }

  // Tab-Klicks: erstelle Key aus city + panda
  document.querySelectorAll(".panda-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".panda-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const city  = tab.dataset.city;
      const panda = tab.dataset.panda;
      currentKey  = `${city}-${panda}`;
      if (sheetData) renderChart(currentKey);
      else loadChartData();
    });
  });

  $("refreshBtn").addEventListener("click", () => loadChartData());

  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => loadChartData(true), AUTO_REFRESH_MS);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    } else {
      loadChartData(true);
      startAutoRefresh();
    }
  });

  loadChartData();
  startAutoRefresh();
</script>

</body>
</html>
